<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Учёт продаж S7</title>
  <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>
  <div class="container">
    <header>
      <h1>✈️ Учёт продаж S7</h1>
      <p>Система учёта дополнительных услуг</p>
      <nav>
        <a href="/" class="active">Главная</a>
        <a href="/report">Отчёт</a>
        <a href="#" onclick="logout()" style="color: #dc2626; margin-left: 10px;">Выйти</a>
      </nav>
    </header>

    <form id="salesForm" class="sales-form">
      <div id="salesContainer">
        <!-- Строки продаж будут добавляться динамически -->
      </div>

      <button type="button" class="add-row-btn" id="addRowBtn">
        + Добавить ещё продажу
      </button>

      <button type="submit" class="submit-btn" id="submitBtn" disabled>
        Внести в отчёт
      </button>
    </form>

    <section class="recent">
      <h2>Последние продажи</h2>
      <ul id="recentList"></ul>
    </section>
  </div>

  <script src="/static/app.js?v=4"></script>
  <script>
    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    }
  </script>
</body>
</html>
